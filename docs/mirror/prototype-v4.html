<title>결리포트 관측소 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;800&display=swap">
<style>
/* Layout: one-screen app over a WebGL sky. Home holds only my star, my synchro and one share button; the record board, reports, stories, the shared story space and my account are full-screen layers. Deliberately one dark look. */
:root{
  color-scheme: dark;
  --ink:#000000;
  --pearl:#F4F4F7;
  --mist:#A9A9B1;
  --faint:#7E7E87;
  --line:rgba(255,255,255,.16);
  --glass:rgba(10,10,14,.55);
  --star:#CAD7FF;
  --gold:#FFD08A;
  --warm:#FFF1E2;
  --kakao:#FEE500;
  --font:"Geist",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --ease:cubic-bezier(.2,.75,.1,1);
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--pearl);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;word-break:keep-all}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.scene{position:fixed;inset:0;display:flex;flex-direction:column;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none;transition:opacity .9s var(--ease);z-index:2}
.scene.fade{opacity:0}
.scene button,.scene .live{pointer-events:auto}
.wrap{width:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--star);outline-offset:3px}
@keyframes up{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.press{transition:transform .2s var(--ease)}
.press:active{transform:scale(.97)}

.wordmark{display:grid;gap:1px;text-align:left;color:var(--pearl)}
.wordmark b{font-weight:800;letter-spacing:-.07em;line-height:1.25}
.wordmark span{font-weight:500;letter-spacing:.12em}
.wordmark.sm b{font-size:18px}.wordmark.sm span{font-size:10px}
.wordmark.xs b{font-size:13px}.wordmark.xs span{font-size:7px}
.wordmark.lg b{font-size:46px}.wordmark.lg span{font-size:25.5px}
.sweep{background:linear-gradient(100deg,#C9C9D0 0%,#C9C9D0 40%,#FFFFFF 50%,#C9C9D0 60%,#C9C9D0 100%);background-size:320% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 6s 1.6s var(--ease) infinite}
@keyframes sweep{0%{background-position:100% 0}55%,100%{background-position:0% 0}}

#login .wrap{align-items:center;justify-content:center}
.logo-in{animation:up 1.8s .2s var(--ease) both}
.tagline{margin:22px 0 0;font-size:14px;color:var(--mist);animation:up 1.4s 1s var(--ease) both}
.auth{margin-top:56px;width:100%;max-width:340px;display:grid;gap:10px;animation:up 1.2s 1.5s var(--ease) both}
.btn-kakao{height:52px;border:0;border-radius:12px;background:var(--kakao);color:rgba(0,0,0,.86);font-size:15px;font-weight:500;cursor:pointer}
.btn-google{height:52px;border:0;border-radius:12px;background:#FFFFFF;color:#1F1F1F;font-size:15px;font-weight:500;cursor:pointer}
.fine{margin:8px 0 0;font-size:11px;color:var(--faint);text-align:center;line-height:1.55}

#quiz .wrap{justify-content:flex-end;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--mist);font-variant-numeric:tabular-nums}
.qbar{flex:1;max-width:160px;height:2px;background:rgba(255,255,255,.16);position:relative;overflow:hidden}
.qbar i{position:absolute;inset:0;background:var(--pearl);transform-origin:left;transform:scaleX(0);transition:transform .8s var(--ease)}
.qspace{flex:1}
.mile{min-height:18px;margin:0;font-size:12px;color:var(--star);text-align:center;opacity:0;transition:opacity .6s}
.mile.on{opacity:1}
.qtitle{margin:0;font-size:clamp(22px,6vw,28px);font-weight:400;line-height:1.38;letter-spacing:-.03em;text-wrap:balance}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:15px;line-height:1.45;cursor:pointer}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;font-weight:500;font-size:12px;color:var(--mist)}
.opt.picked{border-color:var(--pearl)}
.skip{align-self:center;background:none;border:0;color:var(--faint);font-size:12px;padding:6px 10px;cursor:pointer;text-align:center}
.qin>*{animation:up .7s var(--ease) both}
.beam{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;pointer-events:none;z-index:4}

.hbar{display:flex;justify-content:space-between;align-items:center}
.hbar-r{display:flex;align-items:center;gap:8px}
.icon{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:14px}
.badge{position:absolute;top:-3px;right:-3px;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:var(--pearl);color:#000;font-size:10px;font-weight:600;display:grid;place-items:center}
.demo-t{align-self:flex-start;margin-top:8px;height:26px;padding:0 10px;border-radius:999px;border:1px dashed rgba(255,255,255,.25);background:none;font-size:11px;color:var(--faint);cursor:pointer}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12px;cursor:pointer}
.sync{align-self:center;margin-top:18px;display:grid;justify-items:center;gap:4px;background:none;border:0;cursor:pointer;text-shadow:0 1px 14px rgba(0,0,0,.7)}
.sync b{font-weight:300;font-size:52px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sync b small{font-size:20px;color:var(--mist);margin-left:2px}
.sync .lab{font-size:12px;color:var(--mist)}
.hspace{flex:1}
.cta{height:54px;border:0;border-radius:999px;background:var(--pearl);color:#000;font-size:15px;font-weight:500;cursor:pointer}
.graph{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
#flash{position:fixed;inset:0;background:#FFFFFF;opacity:0;pointer-events:none;z-index:5}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-8px);opacity:0;z-index:100;width:max-content;max-width:min(88vw,420px);box-sizing:border-box;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(12,12,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;line-height:1.5;transition:opacity .35s,transform .45s var(--ease);pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

.page{position:fixed;inset:0;z-index:7;overflow-y:auto;background:rgba(0,0,0,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));animation:up .45s var(--ease) both}
.page.top{z-index:10}
.pg{max-width:480px;margin:0 auto;display:grid;gap:20px}
.pghead{display:flex;align-items:center;gap:10px}
.back{height:38px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:4px}
.pghead h2{margin:0;font-size:18px;font-weight:500;letter-spacing:-.02em}
.blk{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.blk h3{margin:0;font-size:13px;font-weight:500;color:var(--mist)}
.big{font-weight:300;font-size:40px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--mist);margin-left:2px}
.txt{margin:0;font-size:14px;line-height:1.7}
.ev{margin:0;font-size:12px;line-height:1.6;color:var(--mist);padding-left:10px;border-left:2px solid rgba(202,215,255,.35)}
.sub{margin:0;font-size:12px;color:var(--faint);line-height:1.6}
.pbar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--star)}
.btn{height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.26);background:none;cursor:pointer;font-size:14px}
.btn.on{background:var(--pearl);color:#000;border-color:var(--pearl)}
.btn[disabled]{opacity:.45;cursor:default}
.radar{justify-self:center;width:100%;max-width:320px;height:auto;overflow:visible}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--mist)}
.legend i{display:inline-block;width:16px;height:0;border-top:1.5px dashed #fff;vertical-align:3px;margin-right:6px}
.legend i.f{border-top:1.5px solid var(--star)}
.pole{display:grid;gap:6px;padding:10px 0}
.pole .ph{display:flex;justify-content:space-between;align-items:baseline;font-size:13px}
.pole .ph b{font-weight:500}
.pole .pct{color:var(--mist);font-variant-numeric:tabular-nums}
.pole.gap .pct{color:var(--star)}
.track{position:relative;height:18px}
.track::before{content:"";position:absolute;left:0;right:0;top:8px;height:2px;background:rgba(255,255,255,.12);border-radius:2px}
.track::after{content:"";position:absolute;left:50%;top:4px;width:1px;height:10px;background:rgba(255,255,255,.2)}
.mk{position:absolute;top:3px;width:12px;height:12px;margin-left:-6px;border-radius:50%;box-sizing:border-box}
.mk.me{border:1.5px solid var(--warm);background:#000}
.mk.fr{background:var(--star);box-shadow:0 0 10px rgba(202,215,255,.7)}
.pole .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span:last-child{color:var(--mist);text-align:right}
.type{display:grid;gap:4px;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0A0A0D}
.type b{font-size:18px;font-weight:500}
.type span{font-size:12px;color:var(--mist);line-height:1.6}
.story{display:grid;gap:10px;padding:16px;border-radius:16px;border:1px solid var(--line);background:#0A0A0D}
.story .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.story .who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--mist);min-width:0;flex-wrap:wrap}
.story .tag{border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:2px 8px;color:var(--pearl)}
.story p{margin:0;font-size:15px;line-height:1.7}
.story .on{font-size:12px;color:var(--star)}
.story.feat{border-color:rgba(202,215,255,.45);box-shadow:0 10px 40px -18px rgba(202,215,255,.6)}
.heart{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:none;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums}
.heart[aria-pressed="true"]{border-color:#FF8FA8;color:#FFB3C4}
.sw{width:46px;height:28px;border-radius:999px;border:1px solid rgba(255,255,255,.24);background:#0B0B0E;padding:3px;display:flex;cursor:pointer;box-sizing:border-box;flex:none}
.sw i{width:20px;height:20px;border-radius:50%;background:#7E7E87;display:block;transition:transform .25s var(--ease)}
.sw[aria-checked="true"]{background:#FFFFFF;border-color:#FFFFFF}
.sw[aria-checked="true"] i{background:#000;transform:translateX(18px)}
.seg2{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;justify-self:start}
.seg2 button{height:30px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--mist);font-size:12px;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--pearl);color:#000}
.prof{display:flex;align-items:center;gap:14px}
.ava{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#2A2A33,#0A0A0D);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.prof b{display:block;font-size:18px;font-weight:500}
.prof span{font-size:13px;color:var(--mist)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer;font-size:14px}
.row span:last-child{color:var(--mist);font-size:13px;text-align:right}
.row .t{display:grid;gap:2px}
.row .t small{font-size:12px;color:var(--faint)}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mist)}

.cardwrap{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:rgba(0,0,0,.5)}
.seg button{height:30px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--mist);font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pearl);color:#000}
.card{position:relative;box-sizing:border-box;height:min(62vh,600px);aspect-ratio:9/16;max-width:100%;border-radius:28px;border:1px solid rgba(255,255,255,.24);box-shadow:0 0 0 200vmax rgba(0,0,0,.74),0 30px 90px -20px rgba(202,215,255,.35);display:flex;flex-direction:column;justify-content:space-between;padding:18px;background-size:cover;background-position:center;overflow:hidden}
.card.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.15) 55%,rgba(0,0,0,.82) 100%)}
.card>*{position:relative}
.ctop{display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:500}
.cbot{display:grid;gap:3px;padding-bottom:30px}
.ck{margin:0;font-size:11px;color:var(--mist);letter-spacing:.04em}
.cn{margin:0;font-weight:300;font-size:56px;line-height:1;letter-spacing:-.03em}
.cn small{font-size:13px;color:var(--mist);margin-left:4px;letter-spacing:0;font-weight:400}
.cs{margin:0;font-size:14px}
.cu{margin:6px 0 0;font-size:11px;color:var(--mist)}
.cmini{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:62%;height:auto;opacity:.95}
.ctoggle{position:absolute;right:14px;bottom:14px;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mist);background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 10px;cursor:pointer}
.ctoggle .sw{width:34px;height:20px;padding:2px}
.ctoggle .sw i{width:14px;height:14px}
.ctoggle .sw[aria-checked="true"] i{transform:translateX(14px)}
.cardbtns{display:grid;grid-template-columns:1fr auto;gap:8px;width:100%;max-width:360px}
.cardwrap>.seg,.cardwrap>.cardbtns,.cardwrap>.sub{position:relative;z-index:1}
.cardbtns .cta{height:50px}
.cardbtns .btn{height:50px;padding:0 18px}

.rater{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);box-sizing:border-box;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.rbox{width:100%;max-width:480px;box-sizing:border-box;padding:20px;border-radius:20px;border:1px solid rgba(255,255,255,.18);background:rgba(10,10,14,.96);display:grid;gap:14px;animation:up .45s var(--ease) both}
.rbox h3{margin:0;font-size:20px;font-weight:400;letter-spacing:-.02em;line-height:1.4}
.rk{font-size:12px;color:var(--mist)}
.three{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:999px;padding:3px}
.three button{height:42px;border:0;border-radius:999px;background:none;color:var(--mist);font-size:12.5px;cursor:pointer;padding:0 4px}
.three button[aria-pressed="true"]{background:var(--pearl);color:#000;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mist);font-size:12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--pearl);color:#000;border-color:var(--pearl)}
.rbox textarea{box-sizing:border-box;width:100%;resize:none;padding:14px;border:1px solid var(--line);border-radius:14px;background:#08080B;color:var(--pearl);font:inherit;font-size:14px;line-height:1.6}
.score{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line)}
.score b{font-weight:300;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:13px;color:var(--mist);line-height:1.5}
.mystar{display:flex;align-items:center;gap:10px;font-size:14px}
.mystar i{flex:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--star) 45%,rgba(202,215,255,0) 72%)}
.mystar i.g{background:radial-gradient(circle,#fff 0%,var(--gold) 45%,rgba(255,208,138,0) 72%);width:26px;height:26px}
.linkbtn{justify-self:center;background:none;border:0;color:var(--mist);font-size:13px;padding:6px 10px;cursor:pointer}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<svg class="graph" id="graph" aria-hidden="true"><path id="cPath" d="" fill="none" stroke="#FFFFFF" stroke-opacity="0" stroke-width="1" stroke-linecap="round"></path></svg>

<section class="scene" id="login">
  <div class="wrap">
    <div class="logo-in"><div class="wordmark lg" aria-label="결리포트 GYEOL REPORT"><b class="sweep">결리포트</b><span class="sweep">GYEOL REPORT</span></div></div>
    <p class="tagline">내가 아는 나, 남이 본 나</p>
    <div class="auth">
      <button class="btn-kakao press" type="button" data-start>카카오로 시작하기</button>
      <button class="btn-google press" type="button" data-start>Google로 계속하기</button>
      <p class="fine">시안이에요. 실제 버튼에는 각 회사 가이드의 로고가 들어가요.<br>인스타·카톡 안에서 열면 구글 대신 「다른 브라우저로 열기」가 떠요.</p>
    </div>
  </div>
</section>

<section class="scene fade" id="quiz" hidden>
  <div class="wrap">
    <div class="qhead"><span id="qn">답 0 / 60</span><div class="qbar" aria-hidden="true"><i id="qbar"></i></div></div>
    <div class="qspace"></div>
    <p class="mile" id="mile" aria-live="polite"></p>
    <div class="qin" id="qin">
      <h2 class="qtitle" id="qt"></h2>
      <div class="opts">
        <button class="opt press" type="button" data-o="0"><b>A</b><span id="qa"></span></button>
        <button class="opt press" type="button" data-o="1"><b>B</b><span id="qb"></span></button>
      </div>
    </div>
    <button class="skip" type="button" id="skip">시안은 6문항이 60문항 몫이에요 · 빨리 채우고 빅뱅 보기</button>
  </div>
</section>

<section class="scene fade" id="home" hidden>
  <div class="wrap">
    <div class="hbar">
