name: V4 Foundation QA
on:
  pull_request:
    paths:
      - 'src/lib/interpretation-v4/**'
      - 'tests/unit/interpretation-v4/**'
      - '.github/workflows/v4-foundation-qa.yml'
  push:
    branches:
      - 'v4/foundation-evidence-contract-01'
permissions:
  contents: read
concurrency:
  group: v4-foundation-qa
  cancel-in-progress: true
jobs:
  v4-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify six product generation and foundation contracts
        run: pnpm exec vitest run tests/unit/interpretation-v4/evidenceFoundation.test.ts tests/unit/interpretation-v4/contentRebuild.test.ts tests/unit/interpretation-v4/fusionCore.test.ts tests/unit/interpretation-v4/comprehensiveQuality.test.ts tests/unit/interpretation-v4/compatibilityIndexRefinement.test.ts
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
